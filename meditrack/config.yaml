name: MediTrack
version: "1.4.1"
slug: meditrack
description: Medikamentengaben für Kinder erfassen – mit Sperrzeiten, Tageslimits und Medikamenten-Datenbank.
url: https://github.com/alpenjugo/meditrack-v2
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:pill
panel_title: Medikamente
# Seitenleiste und Ingress-Sitzung auch für normale (Nicht-Admin-)Benutzer.
# Zugriff bleibt auf angemeldete HA-Benutzer beschränkt (Ingress, kein offener Port).
panel_admin: false
homeassistant_api: true
options:
  publish_sensors: true
  log_level: info
schema:
  publish_sensors: bool
  log_level: list(debug|info|warning|error)
